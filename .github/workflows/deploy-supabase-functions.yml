name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cqudsqhlchxoqcswxpol

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Add MCP callback to Supabase auth redirect allowlist
        run: |
          CALLBACK_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/todo-mcp-server/callback"
          CURRENT=$(curl -sf \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('additional_redirect_urls',''))" 2>/dev/null || echo "")
          if echo "$CURRENT" | grep -qF "$CALLBACK_URL"; then
            echo "Callback URL already in allowlist"
          else
            NEW="${CURRENT:+${CURRENT},}${CALLBACK_URL}"
            curl -sf -X PATCH \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"additional_redirect_urls\": \"${NEW}\"}" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
            echo "Added ${CALLBACK_URL} to Supabase auth redirect allowlist"
          fi
