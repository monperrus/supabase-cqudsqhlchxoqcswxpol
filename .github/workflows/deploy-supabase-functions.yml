name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cqudsqhlchxoqcswxpol

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # The first three migrations were applied to the remote with different
          # timestamps before this workflow existed. Repair the history so that
          # db push only runs the migrations that are genuinely new.
          supabase migration repair --status reverted 20260418172638 20260418172725 20260505205404
          supabase migration repair --status applied  20260418193000 20260418193500 20260505234000
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Run integration tests
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export PATH="$HOME/.deno/bin:$PATH"

          # Resolve the service-role key from the management API so we can call
          # the Supabase Auth Admin API without storing it as a separate secret.
          SRK=$(curl -sf \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys" \
            | python3 -c "import sys,json; print(next(k['api_key'] for k in json.load(sys.stdin) if k['name']=='service_role'))")

          # Create the integration-test user (idempotent: 422 if already exists).
          RESP=$(curl -s -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/admin/users" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-integration@test.invalid","email_confirm":true,"password":"ci_integration_2026!"}')
          UID=$(echo "${RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)

          if [ -z "${UID}" ]; then
            # User already existed — look up by listing and filtering.
            UID=$(curl -sf \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/admin/users" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              | python3 -c "import sys, json; users = json.load(sys.stdin).get('users', []); match = [u['id'] for u in users if u.get('email') == 'ci-integration@test.invalid']; print(match[0] if match else '')" 2>/dev/null || true)
          fi

          if [ -n "${UID}" ]; then
            echo "Test user UUID: ${UID}"
            # Expose to Supabase function as TEST_USER_ID so MCP server uses
            # the same real user for DB writes.
            supabase secrets set --project-ref "${SUPABASE_PROJECT_REF}" TEST_USER_ID="${UID}"
            export SUPABASE_TEST_USER_ID="${UID}"

            TOKEN_RESP=$(curl -s -X POST \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/token?grant_type=password" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" \
              -d '{"email":"ci-integration@test.invalid","password":"ci_integration_2026!"}')
            MCP_TOKEN=$(echo "${TOKEN_RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null || true)
            if [ -n "${MCP_TOKEN}" ]; then
              export SUPABASE_MCP_ACCESS_TOKEN="${MCP_TOKEN}"
            else
              echo "Warning: could not resolve MCP access token — authenticated MCP tests will be skipped"
            fi
          else
            echo "Warning: could not resolve test user — DB-writing tests will be skipped"
          fi

          deno test --allow-net --allow-env tests/integration.test.ts

      - name: Add MCP callback to Supabase auth redirect allowlist
        run: |
          CALLBACK_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/todo-mcp-server/callback"
          CURRENT=$(curl -sf \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('additional_redirect_urls',''))" 2>/dev/null || echo "")
          if echo "$CURRENT" | grep -qF "$CALLBACK_URL"; then
            echo "Callback URL already in allowlist"
          else
            NEW="${CURRENT:+${CURRENT},}${CALLBACK_URL}"
            curl -sf -X PATCH \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"additional_redirect_urls\": \"${NEW}\"}" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
            echo "Added ${CALLBACK_URL} to Supabase auth redirect allowlist"
          fi
